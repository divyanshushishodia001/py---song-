<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05030a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MADE BY DIVYANSHU FOR HIS ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
@supports (height: 100dvh){ html,body{height:100dvh} }
body{touch-action:manipulation;-webkit-touch-callout:none}
:root{
  --bg-deep:#05030a;
  --ink:#f6efe6;
  --rose:#ff7fa8;
  --gold:#d8a355;
  --violet:#6d2f74;
  --blue-mist:#2c3c82;
  --pulse:1;
  --accent:#ff7fa8;
  --accent-soft:rgba(255,127,168,.28);
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
body{
  background:var(--bg-deep);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

/* ---------- ambient layers ---------- */
#bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(circle at 50% 35%,rgba(109,47,116,.34),transparent 28%),
    radial-gradient(circle at 20% 80%,rgba(44,60,130,.22),transparent 32%),
    radial-gradient(circle at 80% 20%,rgba(170,35,75,.16),transparent 30%),
    linear-gradient(145deg,#030208,#100512 55%,#020307);
  transition:filter 1.4s ease;
}
body.playing #bg{filter:saturate(1.18) brightness(1.04)}
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
#grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ---------- overlay / card ---------- */
.overlay{
  position:fixed;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:28px;
}
.card{
  width:min(900px,94vw);
  height:min(720px,88vh);
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  background:rgba(7,5,14,.5);
  backdrop-filter:blur(22px);
  box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  position:relative;overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .6s ease;
  will-change:transform;
}
@supports (height: 100dvh){
  .card{height:min(720px,88dvh)}
}
.card:before{
  content:"";position:absolute;inset:-40%;
  background:conic-gradient(from 180deg,transparent,rgba(255,127,168,.09),transparent,rgba(109,47,116,.09),transparent);
  animation:spin 18s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.halo{
  position:absolute;left:50%;top:42%;width:58%;aspect-ratio:1/1;
  transform:translate(-50%,-50%) scale(var(--pulse,1));
  background:radial-gradient(circle,var(--accent-soft),rgba(109,47,116,.12) 55%,transparent 72%);
  filter:blur(18px);
  opacity:.55;
  pointer-events:none;
  z-index:0;
  transition:background 1.1s ease;
}

.content{position:relative;z-index:2;width:90%}
.kicker{
  font-size:12px;letter-spacing:5px;
  opacity:.5;margin-bottom:22px;
}
.lyric{
  min-height:150px;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:.35em;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(30px,5.2vw,60px);
  line-height:1.2;font-weight:600;
  letter-spacing:-.5px;
  text-shadow:0 8px 35px var(--accent-soft);
  transition:opacity .35s ease,transform .35s ease,filter .35s ease,text-shadow 1.1s ease;
}
.lyric.leaving{opacity:0;transform:translateY(-14px);filter:blur(10px)}
.lyric .word,.lyric .emoji{
  display:inline-block;opacity:0;
  animation:wordIn .6s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes wordIn{
  from{opacity:0;transform:translateY(16px) scale(.96);filter:blur(6px)}
  to{opacity:1;transform:none;filter:none}
}
.sub{
  margin-top:16px;font-size:14px;opacity:.45;letter-spacing:1px;
  transition:opacity .4s ease;
}

/* ---------- controls ---------- */
.controls{
  position:absolute;z-index:3;bottom:calc(46px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:10px;width:88%;
}
button{
  border:1px solid rgba(255,255,255,.15);
  color:#fff;background:rgba(255,255,255,.08);
  border-radius:999px;padding:10px 18px;
  cursor:pointer;font-size:14px;line-height:1;
  backdrop-filter:blur(12px);
  transition:.25s;
}
button:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.vol-wrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:8px 14px;backdrop-filter:blur(12px)}
input[type=range]{accent-color:var(--rose);width:80px;cursor:pointer}
.time{font-size:12px;opacity:.55;font-variant-numeric:tabular-nums;min-width:86px;text-align:left}

/* ---------- spectrum ---------- */
.spectrum{
  position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:34px;z-index:1;
  display:flex;align-items:flex-end;justify-content:center;gap:3px;
  padding:0 8%;pointer-events:none;opacity:.65;
}
.spectrum .sbar{
  width:3px;min-height:2px;border-radius:2px 2px 0 0;
  background:linear-gradient(180deg,var(--accent),transparent);
  transform-origin:bottom;
  transition:background 1.1s ease;
}

/* ---------- progress ---------- */
.progress{
  position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:14px;z-index:3;
  display:flex;align-items:center;cursor:pointer;
  touch-action:pan-x;
}
.progress .track{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.1)}
#bar{position:absolute;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .1s linear}
#thumb{
  position:absolute;top:50%;width:8px;height:8px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 6px var(--accent-soft);
  transform:translate(-50%,-50%) scale(1);
  opacity:.75;transition:opacity .2s ease,transform .18s ease,background 1.1s ease;left:0;
}
.progress:hover #thumb{opacity:1}
.progress.seeking #thumb{opacity:1;transform:translate(-50%,-50%) scale(1.7);box-shadow:0 0 14px var(--accent-soft)}

/* ---------- start screen ---------- */
#start{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  background:rgba(2,1,6,.88);backdrop-filter:blur(20px);
  transition:opacity .6s ease;
}
#start.hide{opacity:0;pointer-events:none}
.startBox{text-align:center;padding:30px;position:relative}
.startBox .heart{font-size:64px;display:inline-block;animation:pulse 1.6s ease-in-out infinite;position:relative}
.startBox .heart:after{
  content:"";position:absolute;inset:-18px;border-radius:50%;
  box-shadow:0 0 0 0 rgba(255,127,168,.35);
  animation:ring 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes ring{
  0%{box-shadow:0 0 0 0 rgba(255,127,168,.35)}
  70%{box-shadow:0 0 0 22px rgba(255,127,168,0)}
  100%{box-shadow:0 0 0 0 rgba(255,127,168,0)}
}
.startBox h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(26px,5vw,42px);margin:18px 0 8px;font-weight:600}
.startBox p{opacity:.55;margin:0 0 26px}
#begin{font-size:16px;padding:14px 26px;background:rgba(255,127,168,.18)}

@media(max-width:600px){
  .card{height:84vh;border-radius:24px}
  @supports (height: 100dvh){ .card{height:84dvh} }
  .lyric{min-height:180px;font-size:32px;gap:.28em}
  .kicker{letter-spacing:3px}
  .controls{bottom:calc(36px + env(safe-area-inset-bottom,0px));gap:8px}
  button{padding:11px 16px;min-height:44px}
  .vol-wrap{padding:6px 12px;min-height:44px}
  input[type=range]{width:60px}
  .spectrum{height:26px;padding:0 6%}
}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="ambient"></canvas>
<div id="grain"></div>

<div id="start">
  <div class="startBox">
    <div class="heart">❤️</div>
    <h1>Something I made for you *DIVYANSHU*</h1>
    <p>Put your headphones on 🎧</p>
    <button id="begin">Tap to begin ✨</button>
  </div>
</div>

<div class="overlay">
  <main class="card">
    <div class="halo" id="halo"></div>
    <div class="content">
      <div class="kicker">a little something</div>
      <div id="lyric" class="lyric" aria-live="polite"></div>
      <div id="sub" class="sub">listen closely</div>
    </div>
    <div class="controls">
      <button id="playpause" aria-label="Pause">⏸ Pause</button>
      <button id="restart" aria-label="Restart">↺ Restart</button>
      <div class="vol-wrap">
        <button id="mute" aria-label="Mute" style="padding:0;border:none;background:none;font-size:16px">🔊</button>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="spectrum" id="spectrum"></div>
    <div class="progress" id="progressWrap">
      <div class="track"></div>
      <div id="bar"></div>
      <div id="thumb"></div>
    </div>
  </main>
</div>

<audio id="song" preload="auto" src="song.mp3"></audio>

<script>
const song = document.getElementById("song");
const lyricEl = document.getElementById("lyric");
const sub = document.getElementById("sub");
const bar = document.getElementById("bar");
const thumb = document.getElementById("thumb");
const progressWrap = document.getElementById("progressWrap");
const start = document.getElementById("start");
const begin = document.getElementById("begin");
const playpause = document.getElementById("playpause");
const restart = document.getElementById("restart");
const muteBtn = document.getElementById("mute");
const volume = document.getElementById("volume");
const timeEl = document.getElementById("time");
const halo = document.getElementById("halo");
const ambient = document.getElementById("ambient");
const actx = ambient.getContext("2d");
const card = document.querySelector(".card");
const spectrumEl = document.getElementById("spectrum");

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const isSmallScreen = window.matchMedia("(max-width:600px)").matches;
const canHover = window.matchMedia("(pointer:fine)").matches;

const GOLD  = { color:"#e0b563", soft:"rgba(224,181,99,.32)" };
const BLUE  = { color:"#5fa8d8", soft:"rgba(95,168,216,.30)" };
const RED   = { color:"#e0667a", soft:"rgba(224,102,122,.32)" };
const PURPLE= { color:"#b57fe0", soft:"rgba(181,127,224,.32)" };

const lyrics = [
  {t:0,  text:"Main likh doon aasmaan par yeh", emoji:"🌌", ...GOLD},
  {t:3,  text:"ke padh lega jahaan saara", emoji:"🌍", ...GOLD},
  {t:6,  text:"Hua na hoga ab koi", emoji:"✨", ...BLUE},
  {t:9,  text:"yahaan hum do sa dobara", emoji:"❤️", ...BLUE},
  {t:12, text:"Main duniya-bhar ki tareefein", emoji:"💫", ...RED},
  {t:15, text:"tere sajde mein laaya hoon", emoji:"❤️", ...RED},
  {t:18, text:"Main tumse ishq karne ki", emoji:"💗", ...PURPLE},
  {t:21, text:"ijaazat Rabb se laaya hoon", emoji:"❤️", ...PURPLE}
];

/* ---------- ambient starfield + hearts ---------- */
function resize(){ ambient.width = innerWidth; ambient.height = innerHeight; }
window.addEventListener("resize", resize);
resize();

const STAR_COUNT = isSmallScreen ? 55 : 110;
const stars = Array.from({length: STAR_COUNT}, () => ({
  x: Math.random()*ambient.width, y: Math.random()*ambient.height,
  r: Math.random()*1.3+.3, tw: Math.random()*Math.PI*2, speed: Math.random()*.02+.006
}));

function spawnHeart(layer, slot){
  const l = layer || (Math.random() < 0.55 ? "far" : "near");
  const size = l === "near" ? Math.random()*16+12 : Math.random()*9+5;
  const bandWidth = ambient.width / HEART_COUNT;
  const x = (typeof slot === "number")
    ? slot*bandWidth + Math.random()*bandWidth
    : Math.random()*ambient.width;
  return {
    layer: l, slot,
    x, y: ambient.height + Math.random()*260,
    baseX: 0,
    size,
    speed: l === "near" ? Math.random()*.5+.22 : Math.random()*.28+.08,
    swayAmp: Math.random()*22+8, swayFreq: Math.random()*.012+.006, phase: Math.random()*Math.PI*2,
    rot: (Math.random()-.5)*0.6, rotSpeed: (Math.random()-.5)*.01,
    opacity: l === "near" ? Math.random()*.28+.14 : Math.random()*.16+.05
  };
}
const HEART_COUNT = isSmallScreen ? 22 : 40;
const hearts = reduceMotion ? [] : Array.from({length: HEART_COUNT}, (_, i) => {
  const h = spawnHeart(undefined, i);
  h.baseX = h.x;
  return h;
});
let bursts = [];

function drawHeartShape(x, y, size, color, rot){
  actx.save();
  actx.translate(x, y);
  if (rot) actx.rotate(rot);
  actx.scale(size/16, size/16);
  actx.beginPath();
  actx.moveTo(0,4);
  actx.bezierCurveTo(0,-2,-8,-2,-8,4);
  actx.bezierCurveTo(-8,10,0,14,0,18);
  actx.bezierCurveTo(0,14,8,10,8,4);
  actx.bezierCurveTo(8,-2,0,-2,0,4);
  actx.fillStyle = color;
  actx.fill();
  actx.restore();
}

function spawnHeartBurst(originX, originY, count){
  if (reduceMotion) return;
  let cx = originX, cy = originY;
  if (typeof cx !== "number"){
    const rect = lyricEl.getBoundingClientRect();
    cx = rect.left + rect.width/2;
    cy = rect.top + rect.height/2;
  }
  const n = count || 6;
  for (let i=0; i<n; i++){
    bursts.push({
      x: cx + (Math.random()-.5)*80,
      y: cy,
      vx: (Math.random()-.5)*.4, vy: -(Math.random()*.6+.3),
      size: Math.random()*9+6, life: 1
    });
  }
}

let bass = 0;
const LINK_DIST = isSmallScreen ? 65 : 95;
function drawConstellation(){
  for (let i=0; i<stars.length; i++){
    for (let j=i+1; j<stars.length; j++){
      const dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < LINK_DIST){
        const a = (1 - dist/LINK_DIST) * .18;
        actx.beginPath();
        actx.strokeStyle = `rgba(200,190,255,${a})`;
        actx.lineWidth = 1;
        actx.moveTo(stars[i].x, stars[i].y);
        actx.lineTo(stars[j].x, stars[j].y);
        actx.stroke();
      }
    }
  }
}
function drawAmbient(){
  actx.clearRect(0, 0, ambient.width, ambient.height);
  if (!reduceMotion) drawConstellation();
  stars.forEach(s => {
    s.tw += s.speed;
    const a = .4 + Math.sin(s.tw)*.3 + bass*.15;
    actx.beginPath();
    actx.fillStyle = `rgba(255,255,255,${Math.max(0,a)})`;
    actx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    actx.fill();
  });
  hearts.forEach(h => {
    h.y -= h.speed;
    h.phase += h.swayFreq;
    h.rot += h.rotSpeed;
    h.x = h.baseX + Math.sin(h.phase) * h.swayAmp;
    if (h.y < -30){
      Object.assign(h, spawnHeart(h.layer, h.slot), {y: ambient.height + 20});
      h.baseX = h.x;
    }
    drawHeartShape(h.x, h.y, h.size, `rgba(255,127,168,${h.opacity})`, h.rot);
  });
  bursts.forEach(b => { b.x += b.vx; b.y += b.vy; b.life -= .015; });
  bursts = bursts.filter(b => b.life > 0);
  bursts.forEach(b => drawHeartShape(b.x, b.y, b.size, `rgba(255,150,190,${b.life*.6})`));
}
drawAmbient();

/* ---------- audio-reactive halo ---------- */
let audioCtx, analyser, dataArray, sourceNode, audioReady = false;
function setupAudioGraph(){
  if (audioReady) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(song);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioReady = true;
  }catch(e){
    analyser = null;
  }
}
let spectrumBars = [];
function buildSpectrum(){
  const count = isSmallScreen ? 20 : 28;
  spectrumEl.innerHTML = "";
  spectrumBars = Array.from({length: count}, () => {
    const el = document.createElement("div");
    el.className = "sbar";
    spectrumEl.appendChild(el);
    return el;
  });
}
buildSpectrum();

function updateAudioReactive(){
  const now = performance.now();
  if (analyser){
    analyser.getByteFrequencyData(dataArray);
    let sum = 0; const n = Math.min(8, dataArray.length);
    for (let i=0; i<n; i++) sum += dataArray[i];
    bass = sum / (n*255);
    halo.style.setProperty("--pulse", (0.85 + bass*0.55).toFixed(3));
    halo.style.opacity = (0.4 + bass*0.5).toFixed(3);
    const usable = Math.min(40, dataArray.length);
    spectrumBars.forEach((el, i) => {
      const bin = Math.floor((i/spectrumBars.length) * usable);
      const v = dataArray[bin] / 255;
      el.style.height = (4 + v*30) + "px";
      el.style.opacity = (0.35 + v*0.65).toFixed(2);
    });
  } else {
    bass = Math.max(0, Math.sin(now/500)) * 0.25;
    spectrumBars.forEach((el, i) => {
      const v = 0.2 + 0.2*Math.abs(Math.sin(now/450 + i*0.4));
      el.style.height = (4 + v*30) + "px";
      el.style.opacity = (0.22 + v*0.4).toFixed(2);
    });
  }
}

/* ---------- lyrics ---------- */
let shown = -1;
let transitioning = false;

function buildLyric(item){
  const words = item.text.split(" ");
  const spans = words.map((w, i) => `<span class="word" style="animation-delay:${i*45}ms">${w}</span>`).join(" ");
  lyricEl.innerHTML = `${spans} <span class="emoji" style="animation-delay:${words.length*45}ms">${item.emoji}</span>`;
}

function setLyric(i){
  if (i === shown) return;
  shown = i;
  transitioning = true;
  lyricEl.classList.add("leaving");
  setTimeout(() => {
    try{
      buildLyric(lyrics[i]);
      lyricEl.classList.remove("leaving");
      spawnHeartBurst();
      document.documentElement.style.setProperty("--accent", lyrics[i].color);
      document.documentElement.style.setProperty("--accent-soft", lyrics[i].soft);
      sub.textContent = (i === lyrics.length-1) ? "Ijaazat Rabb se laaya hoon... ❤️" : "listen closely";
    }catch(e){
      console.error("lyric update failed", e);
    }finally{
      transitioning = false;
    }
  }, 280);
}

/* ---------- progress / time ---------- */
function formatTime(sec){
  if (!isFinite(sec)) return "0:00";
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return `${m}:${s.toString().padStart(2,"0")}`;
}
function updateProgress(){
  const t = song.currentTime;
  const d = song.duration;
  if (isFinite(d) && d > 0){
    const pct = (t/d)*100;
    bar.style.width = pct + "%";
    thumb.style.left = pct + "%";
  }
  timeEl.textContent = `${formatTime(t)} / ${formatTime(d)}`;
}
progressWrap.addEventListener("click", (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (isFinite(song.duration)) song.currentTime = Math.max(0, Math.min(1, pct)) * song.duration;
});
progressWrap.addEventListener("pointerdown", () => progressWrap.classList.add("seeking"));
["pointerup","pointerleave","pointercancel"].forEach(evt =>
  progressWrap.addEventListener(evt, () => progressWrap.classList.remove("seeking"))
);

/* ---------- main loop ---------- */
function loop(){
  try{
    const t = song.currentTime;
    let idx = 0;
    for (let n=0; n<lyrics.length; n++){ if (t >= lyrics[n].t) idx = n; }
    if (!transitioning) setLyric(idx);
    updateProgress();
  }catch(e){ console.error("sync failed", e); }
  try{ updateAudioReactive(); }catch(e){ console.error("audio-reactive failed", e); }
  try{ drawAmbient(); }catch(e){ console.error("ambient draw failed", e); }
  requestAnimationFrame(loop);
}

/* ---------- controls ---------- */
begin.addEventListener("click", async () => {
  start.classList.add("hide");
  setTimeout(() => start.style.display = "none", 650);
  document.body.classList.add("playing");
  try{
    await song.play();
  }catch(e){
    sub.textContent = "Tap play to start the song";
  }
  setupAudioGraph();
  if (audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume().catch(() => {});
  }
  requestAnimationFrame(loop);
});

function syncPlayIcon(){
  playpause.innerHTML = song.paused ? "▶ Play" : "⏸ Pause";
}
playpause.addEventListener("click", async () => {
  if (song.paused){ await song.play(); } else { song.pause(); }
  syncPlayIcon();
});
song.addEventListener("play", syncPlayIcon);
song.addEventListener("pause", syncPlayIcon);

restart.addEventListener("click", async () => {
  song.currentTime = 0;
  shown = -1;
  await song.play();
  syncPlayIcon();
});

muteBtn.addEventListener("click", () => {
  song.muted = !song.muted;
  muteBtn.textContent = song.muted ? "🔇" : "🔊";
});
volume.addEventListener("input", () => {
  song.volume = parseFloat(volume.value);
  if (song.volume === 0){ song.muted = true; muteBtn.textContent = "🔇"; }
  else if (song.muted){ song.muted = false; muteBtn.textContent = "🔊"; }
});

if (canHover && !reduceMotion){
  card.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    const rect = card.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - .5;
    const py = (e.clientY - rect.top) / rect.height - .5;
    card.style.transform = `perspective(1000px) rotateY(${px*5}deg) rotateX(${-py*5}deg)`;
  });
  card.addEventListener("pointerleave", () => { card.style.transform = ""; });
}

card.addEventListener("pointerup", (e) => {
  if (e.target.closest("button, input, .controls, .progress")) return;
  spawnHeartBurst(e.clientX, e.clientY, 8);
  if (navigator.vibrate) { try{ navigator.vibrate(15); }catch(e){} }
});

document.addEventListener("keydown", (e) => {
  if (start.style.display === "none" && e.code === "Space"){
    e.preventDefault();
    playpause.click();
  }
});

song.addEventListener("ended", () => {
  sub.textContent = "Some things are better written in the stars. 🌌❤️";
  syncPlayIcon();
  for (let i=0; i<3; i++) setTimeout(spawnHeartBurst, i*200);
});
</script>
</body>
